#----# Custom Uniforms #---------------------------------------------------------------------------#

#if TAA_UPSCALING_FACTOR == 1
	variable.float.renderScale = 1.0
#elif TAA_UPSCALING_FACTOR == 2
	variable.float.renderScale = sqrt(0.5)
#elif TAA_UPSCALING_FACTOR == 4
	variable.float.renderScale = 0.5
#endif

uniform.vec2.windowSize = vec2(viewWidth, viewHeight)
uniform.vec2.windowTexelSize = vec2(1.0 / viewWidth, 1.0 / viewHeight)

variable.float.viewSizeX = floor(viewWidth * renderScale)
variable.float.viewSizeY = floor(viewHeight * renderScale)

uniform.vec2.viewSize = vec2(viewSizeX, viewSizeY)

variable.float.viewTexelSizeX = 1.0 / viewSizeX
variable.float.viewTexelSizeY = 1.0 / viewSizeY

uniform.vec2.viewTexelSize = vec2(viewTexelSizeX, viewTexelSizeY)

variable.float.offsetIndex = floor(0.5 * (frameCounter % 16) + 1.0)
variable.float.offsetIndexPrev = floor(0.5 * ((frameCounter - 1) % 16) + 1.0)

variable.bool.inverse = frameCounter % 2 == 0

variable.float.taa_offset_x = if(inverse, -TAA_JITTER_SCALE, TAA_JITTER_SCALE) * viewTexelSizeX * (frac(1.3247179 * offsetIndex + 0.5) * 2.0 - 1.0)
variable.float.taa_offset_y = if(inverse, -TAA_JITTER_SCALE, TAA_JITTER_SCALE) * viewTexelSizeY * (frac(1.7548776 * offsetIndex + 0.5) * 2.0 - 1.0)

uniform.vec2.taa_offset = vec2(taa_offset_x, taa_offset_y)

variable.float.taa_offset_prev_x = if(inverse, TAA_JITTER_SCALE, -TAA_JITTER_SCALE) * viewTexelSizeX * (frac(1.3247179 * offsetIndexPrev + 0.5) * 2.0 - 1.0)
variable.float.taa_offset_prev_y = if(inverse, TAA_JITTER_SCALE, -TAA_JITTER_SCALE) * viewTexelSizeY * (frac(1.7548776 * offsetIndexPrev + 0.5) * 2.0 - 1.0)

uniform.vec2.taa_offset_prev = vec2(taa_offset_prev_x, taa_offset_prev_y)

#ifdef VOXY
    variable.float.lodNear = near
    variable.float.lodFar = 32.0 * vxRenderDistance
#else
    variable.float.lodNear = near
    variable.float.lodFar = far * 4.0
#endif

uniform.vec4.lodProjMat_0 = vec4(gbufferProjection.0.0, gbufferProjection.0.1, 0.0, 0.0)
uniform.vec4.lodProjMat_1 = vec4(gbufferProjection.1.0, gbufferProjection.1.1, 0.0, 0.0)
uniform.vec4.lodProjMat_2 = vec4(0.0, 0.0, -2.0 * lodNear / (lodFar - lodNear), -1.0)
uniform.vec4.lodProjMat_3 = vec4(0.0, 0.0, -2.0 * lodFar * lodNear / (lodFar - lodNear), 0.0)

uniform.vec4.lodProjMatPrev_0 = vec4(gbufferPreviousProjection.0.0, gbufferPreviousProjection.0.1, 0.0, 0.0)
uniform.vec4.lodProjMatPrev_1 = vec4(gbufferPreviousProjection.1.0, gbufferPreviousProjection.1.1, 0.0, 0.0)
uniform.vec4.lodProjMatPrev_2 = vec4(0.0, 0.0, -2.0 * lodNear / (lodFar - lodNear), -1.0)
uniform.vec4.lodProjMatPrev_3 = vec4(0.0, 0.0, -2.0 * (lodFar * lodNear) / (lodFar - lodNear), 0.0)

uniform.vec4.lodProjMatInv_0 = vec4(gbufferProjectionInverse.0.0, gbufferProjectionInverse.0.1, 0.0, 0.0)
uniform.vec4.lodProjMatInv_1 = vec4(gbufferProjectionInverse.1.0, gbufferProjectionInverse.1.1, 0.0, 0.0)
uniform.vec4.lodProjMatInv_2 = vec4(0.0, 0.0, 0.0, (lodNear - lodFar) / (2.0 * lodNear * lodFar))
uniform.vec4.lodProjMatInv_3 = vec4(0.0, 0.0, -1.0, 1.0 / lodFar)

variable.float.cameraVelocity_x = floor(cameraPositionInt.x - previousCameraPositionInt.x) + (cameraPositionFract.x - previousCameraPositionFract.x)
variable.float.cameraVelocity_y = floor(cameraPositionInt.y - previousCameraPositionInt.y) + (cameraPositionFract.y - previousCameraPositionFract.y)
variable.float.cameraVelocity_z = floor(cameraPositionInt.z - previousCameraPositionInt.z) + (cameraPositionFract.z - previousCameraPositionFract.z)

uniform.vec3.cameraVelocity = vec3(cameraVelocity_x, cameraVelocity_y, cameraVelocity_z)

# Time uniforms

variable.float.sunDir_x = gbufferModelViewInverse.0.0 * sunPosition.x + gbufferModelViewInverse.1.0 * sunPosition.y + gbufferModelViewInverse.2.0 * sunPosition.z
variable.float.sunDir_y = gbufferModelViewInverse.0.1 * sunPosition.x + gbufferModelViewInverse.1.1 * sunPosition.y + gbufferModelViewInverse.2.1 * sunPosition.z
variable.float.sunDir_z = gbufferModelViewInverse.0.2 * sunPosition.x + gbufferModelViewInverse.1.2 * sunPosition.y + gbufferModelViewInverse.2.2 * sunPosition.z
variable.float.sunDirNorm = 1.0 / sqrt((sunDir_x * sunDir_x) + (sunDir_y * sunDir_y) + (sunDir_z * sunDir_z))

variable.float.sunDirNorm_x = sunDir_x * sunDirNorm
variable.float.sunDirNorm_y = sunDir_y * sunDirNorm
variable.float.sunDirNorm_z = sunDir_z * sunDirNorm

variable.float.viewSunDirNorm_x = sunPosition.x * sunDirNorm
variable.float.viewSunDirNorm_y = sunPosition.y * sunDirNorm
variable.float.viewSunDirNorm_z = sunPosition.z * sunDirNorm

variable.float.moonDir_x = gbufferModelViewInverse.0.0 * moonPosition.x + gbufferModelViewInverse.1.0 * moonPosition.y + gbufferModelViewInverse.2.0 * moonPosition.z
variable.float.moonDir_y = gbufferModelViewInverse.0.1 * moonPosition.x + gbufferModelViewInverse.1.1 * moonPosition.y + gbufferModelViewInverse.2.1 * moonPosition.z
variable.float.moonDir_z = gbufferModelViewInverse.0.2 * moonPosition.x + gbufferModelViewInverse.1.2 * moonPosition.y + gbufferModelViewInverse.2.2 * moonPosition.z
variable.float.moonDirNorm = 1.0 / sqrt((moonDir_x * moonDir_x) + (moonDir_y * moonDir_y) + (moonDir_z * moonDir_z))

variable.float.moonDirNorm_x = moonDir_x * moonDirNorm
variable.float.moonDirNorm_y = moonDir_y * moonDirNorm
variable.float.moonDirNorm_z = moonDir_z * moonDirNorm

variable.float.viewMoonDirNorm_x = moonPosition.x * moonDirNorm
variable.float.viewMoonDirNorm_y = moonPosition.y * moonDirNorm
variable.float.viewMoonDirNorm_z = moonPosition.z * moonDirNorm

uniform.vec3.shadowDir = vec3(if(sunAngle == shadowAngle, sunDirNorm_x, moonDirNorm_x), if(sunAngle == shadowAngle, sunDirNorm_y, moonDirNorm_y), if(sunAngle == shadowAngle, sunDirNorm_z, moonDirNorm_z))
uniform.vec3.moonDir = vec3(moonDirNorm_x, moonDirNorm_y, moonDirNorm_z)
uniform.vec3.sunDir = vec3(sunDirNorm_x, sunDirNorm_y, sunDirNorm_z)

uniform.vec3.viewShadowDir = vec3(if(sunAngle == shadowAngle, viewSunDirNorm_x, viewMoonDirNorm_x), if(sunAngle == shadowAngle, viewSunDirNorm_y, viewMoonDirNorm_y), if(sunAngle == shadowAngle, viewSunDirNorm_z, viewMoonDirNorm_z))
uniform.vec3.viewMoonDir = vec3(viewMoonDirNorm_x, viewMoonDirNorm_y, viewMoonDirNorm_z)
uniform.vec3.viewSunDir = vec3(viewSunDirNorm_x, viewSunDirNorm_y, viewSunDirNorm_z)

# World age in seconds, repeating every 128 days. This is used for animating atmospherics
uniform.float.worldAge = ((worldDay % 128) * 24000.0 + worldTime) / 20.0

uniform.bool.cloudsMoonlit = sunDirNorm_y < -0.02

# Detect whether world age has drastically changed since the last frame
variable.float.worldAgeDelta = abs(worldAge - smooth(worldAge, 0.1, 0.1))

uniform.bool.advanceTime = worldAgeDelta > 0.0008
uniform.bool.worldAgeChanged = worldAgeDelta > 20.0

# https://www.desmos.com/calculator/kniltwna7u
uniform.float.me_fade      = if(sunDirNorm_y < 0.18, 0.37 + 1.2 * max(0.0, -sunDirNorm_y), 1.7)
uniform.float.me_weight    = pow(clamp(1.0 - me_fade * abs(sunDirNorm_y - 0.18), 0.0, 1.0), 2.0)
uniform.float.timeSunrise  = if(sunDirNorm_y > 0.0, 1.0, 0.0) * me_weight
uniform.float.timeNoon     = if(sunDirNorm_y > 0.0, 1.0, 0.0) * (1.0 - me_weight)
uniform.float.timeMidnight = if(sunDirNorm_y < 0.0, 1.0, 0.0) * (1.0 - me_weight)
uniform.float.timeSunset   = if(sunDirNorm_x < 0.0, 1.0, 0.0) * me_weight

# Biome uniforms

uniform.float.biomeCave   = smooth(clamp((63.0 - eyeAltitude) / (63.0 - 50.0), 0.0, 1.0) * (1.0 - eyeBrightness.y / 240.0), 5.0, 2.0)

uniform.float.biomeMayRain     = smooth(if(biome_precipitation != PPT_NONE, 1.0, 0.0), 30, 30)
uniform.float.biomeTemperature = smooth(temperature * 2.0 - 1.0, 1000, 1000)
uniform.float.biomeHumidity    = smooth(rainfall * 2.0 - 1.0, 1000, 1000)

#ifdef LIGHTNING_FLASHES
uniform.float.lightningFlash = smooth(lightningBoltPosition.w, 0.0, 0.75)
#else
uniform.float.lightningFlash = 0.0
#endif

#ifdef DESERT_SANDSTORM
uniform.float.desertSandstorm = smooth(if(biome_precipitation == PPT_NONE, rainStrength, 0.0), 60.0, 30.0)
#else
uniform.float.desertSandstorm = 0.0
#endif

# Lighting uniforms

uniform.float.eyeBlocklight = smooth(eyeBrightness.x / 240.0, 1.0, 1.0)
uniform.float.eyeSkylight   = smooth(eyeBrightness.y / 240.0, 1.0, 1.0)

#ifdef MOON_PHASE_AFFECTS_BRIGHTNESS
uniform.float.moonPhaseBrightness = if( \
	moonPhase == 0, 1.0,                \
	moonPhase == 1, 0.8,               \
	moonPhase == 2, 0.6,                \
	moonPhase == 3, 0.4,               \
	moonPhase == 4, 0.2,              \
	moonPhase == 5, 0.4,               \
	moonPhase == 6, 0.6,                \
	moonPhase == 7, 0.8,               \
	1.0 \
) \
#else
uniform.float.moonPhaseBrightness = 1.0
#endif
